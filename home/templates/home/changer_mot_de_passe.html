{% extends "base.html" %}

{% block title %}Changer mon mot de passe - Mediapass{% endblock %}

{% block content %}

<section class="py-8 md:py-12">
    <div class="max-w-lg mx-auto px-4 sm:px-6 lg:px-8">

        <div class="mb-8">
            <a href="{% url 'home:mon_compte' %}"
               class="inline-flex items-center gap-1.5 text-sm text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Retour au compte
            </a>
        </div>

        <div class="bg-white dark:bg-dark-card rounded-2xl border border-slate-200 dark:border-dark-border shadow-sm overflow-hidden">
            <div class="px-6 py-5 border-b border-slate-200 dark:border-dark-border">
                <h1 class="font-heading text-xl font-bold text-slate-900 dark:text-white">
                    Changer mon mot de passe
                </h1>
                <p class="text-slate-600 dark:text-slate-400 text-sm mt-1">
                    Votre mot de passe doit contenir au moins 6 caractères.
                </p>
            </div>

            <form method="POST" class="px-6 py-5 space-y-5">
                {% csrf_token %}

                <div>
                    <label for="old_password" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">
                        Ancien mot de passe
                    </label>
                    <input type="password" id="old_password" name="old_password" required
                           class="w-full px-4 py-2.5 border border-slate-300 dark:border-slate-600 rounded-xl bg-white dark:bg-dark-bg text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-shadow">
                </div>

                <div>
                    <label for="new_password1" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">
                        Nouveau mot de passe
                    </label>
                    <input type="password" id="new_password1" name="new_password1" required minlength="6"
                           class="w-full px-4 py-2.5 border border-slate-300 dark:border-slate-600 rounded-xl bg-white dark:bg-dark-bg text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-shadow">
                </div>

                <div>
                    <label for="new_password2" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">
                        Confirmer le nouveau mot de passe
                    </label>
                    <input type="password" id="new_password2" name="new_password2" required minlength="6"
                           class="w-full px-4 py-2.5 border border-slate-300 dark:border-slate-600 rounded-xl bg-white dark:bg-dark-bg text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-shadow">
                </div>

                <div class="flex items-center gap-3 pt-2">
                    <button type="submit"
                            class="inline-flex items-center justify-center gap-2 px-6 py-2.5 bg-primary-600 hover:bg-primary-700 text-white font-medium rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 dark:focus:ring-offset-dark-bg transition-colors">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                        Modifier le mot de passe
                    </button>
                    <a href="{% url 'home:mon_compte' %}"
                       class="px-6 py-2.5 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white font-medium rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                        Annuler
                    </a>
                </div>
            </form>
        </div>

    </div>
</section>

{% endblock %}
