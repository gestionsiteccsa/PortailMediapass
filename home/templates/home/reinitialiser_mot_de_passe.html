{% extends "base.html" %}

{% block title %}Nouveau mot de passe - Mediapass{% endblock %}

{% block content %}

<section class="min-h-[calc(100vh_-_20rem)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="w-full max-w-md">

        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-green-100 dark:bg-green-900/30 rounded-2xl mb-4">
                <svg class="w-8 h-8 text-green-600 dark:text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
            </div>
            <h1 class="font-heading text-2xl font-bold text-slate-900 dark:text-white">
                Nouveau mot de passe
            </h1>
            <p class="mt-2 text-slate-600 dark:text-slate-400">
                Choisissez un nouveau mot de passe (au moins 6 caractères).
            </p>
        </div>

        <div class="bg-white dark:bg-dark-card rounded-2xl border border-slate-200 dark:border-dark-border shadow-sm p-6 md:p-8">
            <form method="post" novalidate>
                {% csrf_token %}

                <div class="space-y-5">
                    <div>
                        <label for="new_password1" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">
                            Nouveau mot de passe
                        </label>
                        <input type="password" id="new_password1" name="new_password1" required minlength="6"
                               autocomplete="new-password"
                               class="w-full px-4 py-3 bg-slate-50 dark:bg-dark-bg border border-slate-200 dark:border-dark-border rounded-xl text-slate-900 dark:text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
                               placeholder="Au moins 6 caractères">
                    </div>

                    <div>
                        <label for="new_password2" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">
                            Confirmer le mot de passe
                        </label>
                        <input type="password" id="new_password2" name="new_password2" required minlength="6"
                               autocomplete="new-password"
                               class="w-full px-4 py-3 bg-slate-50 dark:bg-dark-bg border border-slate-200 dark:border-dark-border rounded-xl text-slate-900 dark:text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
                               placeholder="Confirmez le mot de passe">
                    </div>
                </div>

                <button type="submit"
                        class="w-full mt-6 py-3.5 px-4 bg-primary-600 hover:bg-primary-700 text-white font-semibold rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 dark:focus:ring-offset-dark-card transition-colors cursor-pointer">
                    Réinitialiser mon mot de passe
                </button>
            </form>
        </div>

    </div>
</section>

{% endblock %}
