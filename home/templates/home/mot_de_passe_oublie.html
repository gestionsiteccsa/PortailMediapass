{% extends "base.html" %}

{% block title %}Mot de passe oublié - Mediapass{% endblock %}

{% block content %}

<section class="min-h-[calc(100vh_-_20rem)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="w-full max-w-md">

        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-amber-100 dark:bg-amber-900/30 rounded-2xl mb-4">
                <svg class="w-8 h-8 text-amber-600 dark:text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <h1 class="font-heading text-2xl font-bold text-slate-900 dark:text-white">
                Mot de passe oublié
            </h1>
            <p class="mt-2 text-slate-600 dark:text-slate-400">
                Saisissez votre numéro de carte et votre email pour recevoir un lien de réinitialisation.
            </p>
        </div>

        <div class="bg-white dark:bg-dark-card rounded-2xl border border-slate-200 dark:border-dark-border shadow-sm p-6 md:p-8">
            <form method="post" novalidate>
                {% csrf_token %}

                <div class="space-y-5">
                    <div>
                        <label for="card_number" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">
                            Numéro de carte
                        </label>
                        <input type="text" id="card_number" name="card_number" required
                               autocomplete="off"
                               class="w-full px-4 py-3 bg-slate-50 dark:bg-dark-bg border border-slate-200 dark:border-dark-border rounded-xl text-slate-900 dark:text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
                               placeholder="Ex: 12345">
                    </div>

                    <div>
                        <label for="email" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">
                            Adresse email
                        </label>
                        <input type="email" id="email" name="email" required
                               autocomplete="email"
                               class="w-full px-4 py-3 bg-slate-50 dark:bg-dark-bg border border-slate-200 dark:border-dark-border rounded-xl text-slate-900 dark:text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
                               placeholder="vous@exemple.fr">
                    </div>
                </div>

                <button type="submit"
                        class="w-full mt-6 py-3.5 px-4 bg-primary-600 hover:bg-primary-700 text-white font-semibold rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 dark:focus:ring-offset-dark-card transition-colors cursor-pointer">
                    Envoyer le lien
                </button>
            </form>
        </div>

        <p class="mt-6 text-center text-sm text-slate-600 dark:text-slate-400">
            <a href="{% url 'home:login' %}"
               class="font-medium text-primary-600 dark:text-primary-400 hover:text-primary-700 dark:hover:text-primary-300 transition-colors focus:outline-none focus:underline">
                Retour à la connexion
            </a>
        </p>

    </div>
</section>

{% endblock %}
